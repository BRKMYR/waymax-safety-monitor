[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waymax-safety-monitor"
version = "0.1.0"
description = "Real-time safety monitoring dashboard for autonomous fleets — teleoperation trigger detection built on Waymax and Waymo Open Motion Dataset"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "BRKMYR" }]

dependencies = [
    "numpy>=1.24",
    "pygame-ce>=2.4",
]

[project.optional-dependencies]
waymax = [
    "waymax>=0.2",
    "jax>=0.4",
    "tensorflow>=2.14",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
safety-monitor = "src.dashboard.app:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
