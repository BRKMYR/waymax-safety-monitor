name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      SDL_VIDEODRIVER: dummy

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -v --tb=short

      - name: Headless acceptance run (hard_brake)
        run: |
          python -m src.dashboard.app \
            --scenario hard_brake \
            --headless \
            --frames-out /tmp/headless_hard_brake \
            --events-out /tmp/headless_hard_brake/events.json \
            --frame-stride 1

      - name: Assert 91 frames were produced
        run: |
          count=$(ls /tmp/headless_hard_brake/frame_*.png | wc -l)
          echo "found $count frames"
          test "$count" -eq 91

      - name: Assert hard_brake RED event fires at timestep 31
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("/tmp/headless_hard_brake/events.json"))
          hb = [e for e in data if e["kind"] == "hard_brake"]
          assert len(hb) == 1, f"expected 1 hard_brake event, got {len(hb)}"
          e = hb[0]
          assert e["agent_id"] == 1, e
          assert e["timestep"] == 31, e
          assert e["severity"] == "RED", e
          print("hard_brake acceptance OK:", e)
          PY
